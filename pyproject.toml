[project]
name = "deskwork"
version = "0.1.0"
description = "A retrieval-grounded computer-use agent that completes multi-step administrative work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "fastembed>=0.4",
    "pypdf>=5.1",
    "python-dotenv>=1.0",
]

[project.scripts]
deskwork = "deskwork.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskwork", "src/portal"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: exercises the real Anthropic API and spends credit (deselected by default)",
    "display: needs an X display (Xvfb) and xdotool/scrot on PATH",
    "db: needs a running Postgres with pgvector",
]
addopts = "-m 'not live' --strict-markers"
